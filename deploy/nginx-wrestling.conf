upstream wrestling_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Reject / redirect raw Elastic IP and unknown hosts — API is hostname-only.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://16.16.113.6.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/16.16.113.6.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16.16.113.6.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do not serve the API on the raw IP.
    return 444;
}

# Canonical HTTPS hostname (Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name 16.16.113.6.sslip.io;

    client_max_body_size 512M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://16.16.113.6.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 16.16.113.6.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/16.16.113.6.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16.16.113.6.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 512M;

    location / {
        proxy_pass http://wrestling_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}

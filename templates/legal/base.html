<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vision Quest{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f5f1;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #c45c26;
      --line: #ddd6cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    header {
      padding: 1.5rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    header .brand {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    header h1 {
      margin: 0.35rem 0 0;
      font-size: 1.75rem;
      font-weight: 700;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }
    p, li { color: var(--ink); }
    .muted { color: var(--muted); font-size: 0.95rem; }
    h2 {
      margin-top: 1.75rem;
      font-size: 1.15rem;
    }
    ul { padding-left: 1.25rem; }
    footer {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.25rem 2.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">Vision Quest Sync</div>
    <h1>{% block heading %}{% endblock %}</h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>
      <a href="/terms/">Terms</a> ·
      <a href="/privacy/">Privacy</a>
    </p>
  </footer>
</body>
</html>
